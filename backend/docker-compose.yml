services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trackmauzo-api
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - .env
    volumes:
      - trackmauzo_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  trackmauzo_storage:
